<main class="form-wrapper">
  <form class="form">
    <h2 class="titulo">Nova transação</h2>

    <div class="campos">
      <label class="campo-grupo">
        Transação
        <div class="select-wrapper">
          <select
            name="tipo-transacao"
            class="campo select-tipo-transacao"
            required
          >
            <option value="" selected disabled>
              Selecione o tipo de transação
            </option>
            <option value="deposito">Depósito</option>
            <option value="saque">Saque</option>
          </select>
        </div>
      </label>
      <label class="campo-grupo">Valor</label>
      <input
        type="number"
        min="0.01"
        step="0.01"
        name="valor"
        class="campo input-valor-transacao"
        required
      />
      <button class="botao-confirmar-transacao">Confirmar Transação</button>
    </div>
  </form>
</main>
