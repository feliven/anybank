<aside class="extrato">
  <h2 class="titulo">Extrato</h2>

  <ul class="transacoes">
    @for (itemListaTransacoes of listaTransacoes(); track
    itemListaTransacoes.id) {
    <li>
      <app-transacao [transacao]="itemListaTransacoes"></app-transacao>
    </li>
    } @empty {
    <li aria-hidden="true">Não há transações.</li>
    }
  </ul>
</aside>
